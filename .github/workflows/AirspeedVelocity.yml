name: Benchmark a Pull Request

# No branches filter: stacked PRs target other feature branches, and each PR is
# benchmarked against its own base (base.sha), not the default branch.
on:
  pull_request:

# contents: read is required explicitly — this repo is private, and a permissions
# block zeroes out everything unlisted, which breaks checkout.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # benchpkg needs both PR revs from the local repo (private repo: no
          # anonymous clone via --url), so fetch full history
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - uses: julia-actions/cache@v3
      - name: Extract Package Name from Project.toml
        id: extract-package-name
        run: |
          PACKAGE_NAME=$(grep "^name" Project.toml | sed 's/^name = "\(.*\)"$/\1/')
          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
      - name: Build AirspeedVelocity
        env:
          JULIA_NUM_THREADS: 2
        run: |
          # Lightweight build step, as sometimes the runner runs out of memory:
          julia -e 'ENV["JULIA_PKG_PRECOMPILE_AUTO"]=0; import Pkg; Pkg.add(;url="https://github.com/MilesCranmer/AirspeedVelocity.jl.git")'
          julia -e 'ENV["JULIA_PKG_PRECOMPILE_AUTO"]=0; import Pkg; Pkg.build("AirspeedVelocity")'
      - name: Add ~/.julia/bin to PATH
        run: |
          echo "$HOME/.julia/bin" >> $GITHUB_PATH
      - name: Run benchmarks
        run: |
          mkdir results
          benchpkg ${{ steps.extract-package-name.outputs.package_name }} --rev="${{ github.event.pull_request.base.sha }},${{ github.event.pull_request.head.sha }}" --path=. --bench-on="${{ github.event.pull_request.head.sha }}" --output-dir=results/ --tune
      - name: Create plots from benchmarks
        run: |
          mkdir -p plots
          benchpkgplot ${{ steps.extract-package-name.outputs.package_name }} --rev="${{ github.event.pull_request.base.sha }},${{ github.event.pull_request.head.sha }}" --npart=10 --format=png --input-dir=results/ --output-dir=plots/
      - name: Upload plot as artifact
        uses: actions/upload-artifact@v7
        with:
          name: plots
          path: plots
      # Time and memory are emitted as two separate tables rather than one
      # `--mode=time,memory` call: that prints them back to back with no blank line
      # between, which markdown renders as a single malformed table.
      - name: Create markdown table from benchmarks
        run: |
          NAME='${{ steps.extract-package-name.outputs.package_name }}'
          REVS='${{ github.event.pull_request.base.sha }},${{ github.event.pull_request.head.sha }}'
          benchpkgtable "$NAME" --rev="$REVS" --input-dir=results/ --ratio --mode=time > time.md
          benchpkgtable "$NAME" --rev="$REVS" --input-dir=results/ --ratio --mode=memory > memory.md
          {
            echo '### Benchmark Results'
            echo ''
            echo '#### Time'
            echo ''
            cat time.md
            echo ''
            echo '#### Memory and allocations'
            echo ''
            cat memory.md
            echo ''
            echo '### Benchmark Plots'
            echo 'A plot of the benchmark results have been uploaded as an artifact to the workflow run for this PR.'
            echo 'Go to "Actions"->"Benchmark a pull request"->[the most recent run]->"Artifacts" (at the bottom).'
          } > body.md
      - name: Find Comment
        uses: peter-evans/find-comment@v4
        id: fcbenchmark
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: Benchmark Results
      - name: Comment on PR
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.fcbenchmark.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: body.md
          edit-mode: replace
