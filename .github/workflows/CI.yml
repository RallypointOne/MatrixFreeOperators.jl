name: CI
on:
  push:
    branches:
      - main
      - master
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }} - threads ${{ matrix.julia-threads }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    env:
      JULIA_NUM_THREADS: ${{ matrix.julia-threads }}
    strategy:
      fail-fast: false
      matrix:
        julia-version:
          - '1.10'
          - '1.11'
          - '1.12'
        os:
          - ubuntu-latest
        julia-threads:
          - '1'
          - '2'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  docs-render:
    name: Docs render smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Install lcov
        run: sudo apt-get install -y lcov
      - name: Install docs dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      # This job is a render smoke test — it catches broken .qmd cells. Building the
      # real coverage report runs the whole suite under instrumentation, which the
      # test matrix above already covers six times over, and had grown to ~27 of the
      # 30-minute budget. Docs.yml never sets this, so published docs keep the real
      # report. See docs/pages/coverage.qmd.
      - name: Render template's own docs
        env:
          MFO_DOCS_SKIP_COVERAGE: 'true'
        run: quarto render docs
